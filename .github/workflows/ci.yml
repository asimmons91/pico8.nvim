name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  neovim:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.11.4
          - v0.12.6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: asimmons91/pico-lsp
          path: pico-lsp-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: pico-lsp-src/go.mod
          cache-dependency-path: pico-lsp-src/go.sum

      - name: Build pico-lsp test binary
        working-directory: pico-lsp-src
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/bin/pico-lsp" ./cmd/pico-lsp

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Run headless plugin tests
        env:
          PICO_LSP_BIN: ${{ github.workspace }}/bin/pico-lsp
        run: |
          tests/run.sh

  treesitter-macos:
    name: Tree-sitter installer (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.6

      - name: Check C compiler
        run: command -v cc || command -v clang

      - name: Run Tree-sitter installer test
        env:
          PICO8_NVIM_ROOT: ${{ github.workspace }}
          XDG_DATA_HOME: ${{ runner.temp }}/pico8-nvim-data
        run: |
          mkdir -p "$XDG_DATA_HOME"
          nvim --headless --clean -u NONE \
            --cmd "set runtimepath+=$PICO8_NVIM_ROOT" \
            -l "$PICO8_NVIM_ROOT/tests/treesitter.lua"
